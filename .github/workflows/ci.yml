name: Quality checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install uv==0.9.18
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check backend tests
      - run: uv run pytest --cov=docagent --cov-report=term-missing
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
  services:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: docagent
          POSTGRES_PASSWORD: integration-only
          POSTGRES_DB: docagent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docagent -d docagent"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DOCAGENT_INTEGRATION_DATABASE_URL: postgresql+psycopg://docagent:integration-only@localhost:5432/docagent
      DOCAGENT_INTEGRATION_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install uv==0.9.18
      - run: uv sync --frozen --extra dev
      - run: uv run pytest tests/integration -v
