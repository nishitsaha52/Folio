[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-documentation-agent"
version = "0.1.0"
description = "Evidence-based repository analysis and human-controlled documentation workflows"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "httpx>=0.28,<1",
  "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3", "sqlalchemy>=2.0,<3", "alembic>=1.14,<2",
  "cryptography>=44", "python-docx>=1.1,<2", "openpyxl>=3.1,<4",
  "reportlab>=4.2,<5", "defusedxml>=0.7,<1", "packaging>=24",
  "celery[redis]>=5.4,<6", "psycopg[binary]>=3.2,<4",
  "fakeredis>=2.31,<3", "redis>=5,<9",
  "boto3>=1.36,<2",
  "openai>=2.0,<3", "anthropic>=0.75,<2", "google-genai>=1.50,<3",
  "tree-sitter>=0.25,<0.26", "tree-sitter-javascript>=0.25,<0.26",
  "tree-sitter-typescript>=0.23,<0.24", "tree-sitter-java>=0.23,<0.24",
  "tree-sitter-go>=0.25,<0.26", "PyYAML>=6,<7", "pathspec>=0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "moto[s3]>=5,<6"]

[project.scripts]
docagent = "docagent.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
