# Reuse pgvector, redis and minio on the existing infra-shared network.
# Generate .env.compose first: docagent compose-env
x-application: &application
  build: .
  image: docagent:local
  env_file:
    - path: .env
    - path: .env.compose
      # Preserve URL credentials containing dollar signs or quotes verbatim.
      format: raw
  environment:
    DOCAGENT_DATA_DIR: /data
    DOCAGENT_JOB_BACKEND: celery
    DOCAGENT_REDIS_BACKEND: real
    DOCAGENT_PUBLIC_URL: ${DOCAGENT_PUBLIC_URL:-http://localhost:8000}
    DOCAGENT_TEST_EXECUTION_ENABLED: "false"
  networks:
    - infrastructure
  volumes:
    # Folio artifacts/scratch only. Existing infrastructure volumes are external.
    - artifacts:/data
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  migrate:
    <<: *application
    command: ["docagent", "init-db"]
    restart: "no"
    healthcheck:
      disable: true
  api:
    <<: *application
    ports:
      - "127.0.0.1:${DOCAGENT_API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
  worker:
    <<: *application
    command: ["docagent", "worker", "--concurrency=2"]
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
  scheduler:
    <<: *application
    command: ["docagent", "scheduler", "--schedule=/data/celerybeat-schedule"]
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully

networks:
  infrastructure:
    external: true
    name: ${DOCAGENT_DOCKER_NETWORK:-infra-shared}

volumes:
  artifacts:
